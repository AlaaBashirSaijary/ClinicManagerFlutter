name: clinic_manager_flutter
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.0+5

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (presentation layer).
  flutter_riverpod: ^2.6.1

  # Dependency injection (service locator), same role composer's autoloader +
  # Laravel's container play in the PHP project.
  get_it: ^8.0.3

  # Local SQLite — the direct equivalent of the Laravel/Eloquent + SQLite
  # setup, just accessed from Dart instead of PHP.
  sqflite: ^2.4.1
  path: ^1.9.1

  # Lets the clinic point storage at an external drive folder, and keeps a
  # security-scoped bookmark so iOS remembers that permission across launches
  # — the native equivalent of the Laravel admin settings' path picker.
  file_picker: ^8.1.7

  # Functional-style error handling (Either<Failure, T>), so use cases return
  # typed failures instead of throwing — keeps the domain layer framework-free.
  dartz: ^0.10.1
  equatable: ^2.0.7

  # Password hashing for local auth (bcrypt, matching Laravel's default).
  bcrypt: ^1.1.3

  # Persists "who is currently signed in" across app restarts — the Flutter
  # equivalent of Laravel's session cookie.
  shared_preferences: ^2.3.4

  intl: ^0.20.2

  # Renders the onboarding illustrations (assets/images/*.svg) — bundled
  # offline, same as the fonts, so nothing depends on network access.
  flutter_svg: ^2.0.17

  # Lets a visit attach photos (eye photos, old prescriptions) from the
  # camera or the device's own photo library.
  image_picker: ^1.1.2
  pdf: ^3.12.0
  printing: ^5.14.3

  # Reads the installed app version/build number for display in Admin —
  # lets a support visit confirm which build is on the device at a glance.
  package_info_plus: ^9.0.1

  # Opens the vendor's WhatsApp chat for the "تواصل مع الدعم" button —
  # the direct-support channel this offline app relies on instead of any
  # in-app licensing/update service.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  # Lets sqflite run against an in-memory SQLite engine under `flutter test`
  # (the headless Dart VM has no native iOS/Android platform channel).
  sqflite_common_ffi: ^2.3.4+4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the app's launcher icon (assets/icon/*.png, rasterized from
  # the iris BrandMark) for every platform from one source image.
  flutter_launcher_icons: ^0.14.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # Onboarding illustrations (Storyset "-pana" style, from storyset.com —
  # attribution added on the Admin page's about line).
  assets:
    - assets/images/

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Same IBM Plex Sans Arabic used by the Laravel app
  # (public/fonts/*.woff2), converted to .ttf with fonttools so the two
  # products read as one design system instead of two different typefaces.
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm-plex-sans-arabic-arabic-400.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-sans-arabic-arabic-500.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-sans-arabic-arabic-600.ttf
          weight: 600
        - asset: assets/fonts/ibm-plex-sans-arabic-arabic-700.ttf
          weight: 700

# Launcher icon source — assets/icon/*.png are rasterized straight from the
# iris BrandMark painter (lib/core/widgets/brand_mark.dart), so the app icon
# and the in-app logo are the same mark instead of drifting apart. Only
# ios/ and android/ exist in this project, so those are the only targets.
# Re-run `dart run flutter_launcher_icons` after regenerating those PNGs.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F4FAFC"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
