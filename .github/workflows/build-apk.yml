name: Build release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

# Lets GITHUB_TOKEN (already provided free by Actions, no new secret needed)
# create the GitHub Release below — the default token is read-only unless a
# job says otherwise.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable

      # Recreates what android/.gitignore deliberately keeps out of the
      # repo (see android/keystore/README.md) — the keystore and its
      # passwords, held instead as encrypted repo secrets. Without this,
      # the Gradle build falls back to debug signing (see the
      # hasReleaseKeystore check in android/app/build.gradle.kts) instead
      # of failing outright, so a missing secret would silently produce an
      # unsigned-for-release APK rather than an error — the explicit check
      # below turns that into a loud failure instead.
      - name: Restore the release keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — see android/keystore/README.md for what to upload."
            exit 1
          fi
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/clinic_manager_release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}
          storeFile=keystore/clinic_manager_release.jks
          EOF

      - run: flutter pub get

      # GEMINI_API_KEY is compiled in as a constant (see GeminiService) —
      # never committed to source. Missing/empty just disables the
      # AI-assist features gracefully (they're optional extras, not core
      # functionality — see GeminiService's own doc comment), so a fork
      # without this secret still gets a working build.
      - run: flutter build apk --release --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # pubspec's version (e.g. 1.4.0+6) becomes the release tag verbatim —
      # the app's own in-app update check (UpdateCheckService) parses the
      # part after "+" back out as an integer build number to compare
      # against PackageInfo, so this format is load-bearing, not cosmetic.
      - name: Extract version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # A permanent, publicly downloadable release replaces the old 30-day
      # workflow artifact — it's what UpdateCheckService polls
      # (api.github.com/.../releases/latest, no auth needed on this public
      # repo) and what its download link points a doctor's device at
      # directly, with no GitHub sign-in in the way.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "عيادتي ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
